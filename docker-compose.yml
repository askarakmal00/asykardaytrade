services:
  web:
    build: .
    container_name: asykar_daytrade
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Jakarta
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
