<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IDX Day Trade Signal System{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Lightweight Charts 4.2.1 Stable -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            --bg-main: #0c1017;
            --bg-card: #151b26;
            --bg-card-hover: #1c2433;
            --border-color: #232d3f;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #f1f5f9;
            min-height: 100vh;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .navbar {
            background-color: #111620 !important;
            border-bottom: 1px solid var(--border-color);
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        .table-dark {
            --bs-table-bg: var(--bg-card);
            --bs-table-border-color: var(--border-color);
        }

        .table-hover tbody tr:hover {
            background-color: var(--bg-card-hover) !important;
        }

        .badge-ready {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-pullback {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .badge-breakout {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .badge-watch {
            background-color: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .badge-notrade {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .stat-card {
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border-color);
            background: linear-gradient(145deg, #161e2b, #111722);
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .btn-glow-primary {
            background-color: #2563eb;
            color: #fff;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-glow-primary:hover {
            background-color: #1d4ed8;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
            color: #fff;
        }

        .btn-glow-success {
            background-color: #059669;
            color: #fff;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-glow-success:hover {
            background-color: #047857;
            box-shadow: 0 0 15px rgba(5, 150, 105, 0.5);
            color: #fff;
        }

        .checklist-item {
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .checklist-pass {
            background-color: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-left: 3px solid #10b981;
        }
        .checklist-warn {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-left: 3px solid #ef4444;
        }
        .badge-valid {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .badge-missed {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .badge-extended {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .badge-fresh {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .badge-aging {
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .badge-stale {
            background-color: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark py-2 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-graph-up-arrow text-primary fs-4"></i>
                <span>IDX <span class="text-primary">DAY TRADE</span> SIGNAL</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4 gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'home' %}active fw-bold text-white bg-dark rounded{% endif %}" href="/">
                            <i class="bi bi-house me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'screener' %}active fw-bold text-white bg-dark rounded{% endif %}" href="/screener">
                            <i class="bi bi-filter-square me-1"></i> Screener Universe
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'backtest' %}active fw-bold text-white bg-dark rounded{% endif %}" href="/backtest">
                            <i class="bi bi-clock-history me-1"></i> Strategy Backtest
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'portfolio' %}active fw-bold text-white bg-dark rounded{% endif %}" href="/portfolio">
                            <i class="bi bi-briefcase me-1 text-success"></i> Portfolio
                        </a>
                    </li>
                </ul>


                <div class="d-flex align-items-center gap-3">
                    <div class="text-end d-none d-md-block">
                        <div class="small text-muted">Provider: <span class="text-info fw-semibold">Yahoo Finance</span></div>
                        <div class="small text-muted">Status: <span class="badge bg-secondary">Delayed / Historical</span></div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 pb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize tooltips globally
        document.addEventListener('DOMContentLoaded', function () {
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
