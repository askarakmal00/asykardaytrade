<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IDX Signal{% endblock %}</title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Lightweight Charts -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        /* ── Design Tokens ─────────────────────────────────── */
        :root {
            --bg-root: #0D0D0D;
            --bg-surface: #141414;
            --border: #222222;
            --text-primary: #F0F0F0;
            --text-secondary: #6B6B6B;
            --accent: #E8A03A;
            --accent-dim: rgba(232, 160, 58, 0.12);
            --accent-dim-border: rgba(232, 160, 58, 0.3);
            --green: #3FB950;
            --red: #F85149;
            --sidebar-bg: #0A0A0A;
            --sidebar-border: #1A1A1A;
            --sidebar-width: 220px;
            --radius: 6px;
        }

        /* ── Reset ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-root);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Sidebar ───────────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-logo a {
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .sidebar-logo a span {
            color: var(--accent);
        }

        .sidebar-nav {
            padding: 16px 0;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
        }

        .nav-item.active {
            color: var(--accent);
            border-left-color: var(--accent);
            background: var(--accent-dim);
        }

        .nav-item i[data-lucide] {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ── Sidebar Footer ────────────────────────────────── */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--sidebar-border);
        }

        .market-status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .market-status-dot.open { background: var(--green); }
        .market-status-dot.closed { background: var(--text-secondary); }

        .sidebar-footer-text {
            font-size: 11.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }

        .sidebar-footer-schedule {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* ── Main Content ──────────────────────────────────── */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 48px;
            flex: 1;
            min-width: 0;
        }

        /* ── Top Bar ───────────────────────────────────────── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 32px;
        }

        .market-status-inline {
            margin-right: auto;
            font-size: 12.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .market-status-inline .status-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        .market-status-inline .status-pill.open {
            color: var(--green);
            border-color: rgba(63, 185, 80, 0.3);
            background: rgba(63, 185, 80, 0.08);
        }

        .market-status-inline .status-pill.closed {
            color: var(--text-secondary);
        }

        /* ── Scan Progress Bar ─────────────────────────────── */
        .scan-progress-wrap {
            display: none;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .scan-progress-wrap.visible { display: block; }

        .scan-progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .scan-progress-bar-track {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .scan-progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* ── Buttons ───────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            border: none;
            white-space: nowrap;
        }

        .btn i[data-lucide] { width: 14px; height: 14px; }

        .btn-outline {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: #555;
            background: rgba(255,255,255,0.04);
        }

        .btn-amber {
            background: var(--accent);
            color: #0D0D0D;
            border: 1px solid var(--accent);
            font-weight: 600;
        }

        .btn-amber:hover { background: #f0aa40; }

        .btn-amber-outline {
            background: transparent;
            border: 1px solid var(--accent-dim-border);
            color: var(--accent);
        }

        .btn-amber-outline:hover {
            background: var(--accent-dim);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Cards / Surfaces ──────────────────────────────── */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .card-sm { padding: 16px; }

        /* ── Table ─────────────────────────────────────────── */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-surface);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead tr {
            border-bottom: 1px solid var(--border);
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }

        tbody tr:last-child { border-bottom: none; }

        tbody tr:hover { background: rgba(255,255,255,0.02); }

        td {
            padding: 12px 16px;
            vertical-align: middle;
        }

        /* ── Typography helpers ────────────────────────────── */
        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .text-secondary { color: var(--text-secondary); }
        .text-accent { color: var(--accent); }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-white { color: var(--text-primary); }

        h1, h2, h3, h4, h5 {
            font-weight: 600;
            line-height: 1.2;
        }

        /* ── Status Badges ─────────────────────────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .badge-ready {
            background: rgba(28, 20, 0, 0.9);
            color: var(--accent);
            border: 1px solid var(--accent-dim-border);
        }

        .badge-wait {
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .badge-watch {
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            border: 1px solid #2a3040;
        }

        .badge-notrade {
            background: rgba(248, 81, 73, 0.08);
            color: var(--red);
            border: 1px solid rgba(248, 81, 73, 0.2);
        }

        .badge-green {
            background: rgba(63, 185, 80, 0.1);
            color: var(--green);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        /* ── Progress Bar ──────────────────────────────────── */
        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.4s;
        }

        /* ── HR separator ──────────────────────────────────── */
        hr {
            border: none;
            border-top: 1px solid #1E1E1E;
            margin: 24px 0;
        }

        /* ── Form controls ─────────────────────────────────── */
        input, select, textarea {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius);
            padding: 8px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-dim-border);
        }

        select option {
            background: #1A1A1A;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        /* ── Utilities ─────────────────────────────────────── */
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .gap-6 { gap: 24px; }
        .flex-1 { flex: 1; }
        .min-w-0 { min-width: 0; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hidden { display: none !important; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
        }

        /* ── Spinner ───────────────────────────────────────── */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* ── Scrollbar ─────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

        /* ── Empty state ───────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
        }

        .empty-state i[data-lucide] {
            width: 40px;
            height: 40px;
            color: var(--text-secondary);
            margin: 0 auto 16px;
            display: block;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 8px;
        }

        /* ── Modal ─────────────────────────────────────────── */
        .modal, .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1050;
            padding: 20px;
        }
        .modal.show, .modal-overlay.active { display: flex; }
        .modal-dialog {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }
        .modal-dialog.modal-lg { max-width: 800px; }
        .modal-content, .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            color: var(--text-primary);
        }
        .modal-header, .modal-footer {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-footer {
            border-bottom: none;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-body { padding: 20px; }
        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .btn-close::before { content: "×"; }

        /* ── Row & Col helpers ─────────────────────────────── */
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: -8px;
        }
        [class*="col-"] {
            padding: 8px;
            box-sizing: border-box;
        }
        .col-12 { width: 100%; }
        .col-md-3 { width: 25%; }
        .col-md-4 { width: 33.333%; }
        .col-md-6 { width: 50%; }
        .col-lg-6 { width: 50%; }
        .col-xl-2 { width: 16.666%; }
        @media (max-width: 768px) {
            .col-md-3, .col-md-4, .col-md-6, .col-lg-6, .col-xl-2 { width: 100%; }
        }

        /* ── Alert helpers ─────────────────────────────────── */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 16px;
            border: 1px solid transparent;
        }
        .alert-info {
            background: rgba(96, 165, 250, 0.08);
            border-color: rgba(96, 165, 250, 0.2);
            color: #93c5fd;
        }
        .alert-danger {
            background: rgba(248, 81, 73, 0.08);
            border-color: rgba(248, 81, 73, 0.2);
            color: var(--red);
        }
        .alert-warning {
            background: rgba(232, 160, 58, 0.08);
            border-color: var(--accent-dim-border);
            color: var(--accent);
        }

        {% block head_styles %}{% endblock %}
    </style>
    {% block head %}{% endblock %}
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────────────────────── -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <a href="/">IDX <span>Signal</span></a>
    </div>

    <nav class="sidebar-nav">
        <a href="/" class="nav-item {% if active_page == 'home' %}active{% endif %}">
            <i data-lucide="layout-dashboard"></i>
            Sinyal Hari Ini
        </a>
        <a href="/screener" class="nav-item {% if active_page == 'screener' %}active{% endif %}">
            <i data-lucide="search"></i>
            Screener Universe
        </a>
        <a href="/backtest" class="nav-item {% if active_page == 'backtest' %}active{% endif %}">
            <i data-lucide="bar-chart-2"></i>
            Backtest
        </a>
        <a href="/portfolio" class="nav-item {% if active_page == 'portfolio' %}active{% endif %}">
            <i data-lucide="briefcase"></i>
            Portfolio
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-footer-text">
            <span class="market-status-dot {% if market_status_open %}open{% else %}closed{% endif %}"></span>
            IDX &nbsp;&mdash;&nbsp; {% if market_status_open %}Pasar Buka{% else %}Pasar Tutup{% endif %}
        </div>
        <div class="sidebar-footer-schedule">
            <i data-lucide="clock" style="width:11px;height:11px;vertical-align:middle;margin-right:4px;"></i>
            Update otomatis 17:00
        </div>
    </div>
</aside>

<!-- ── MAIN CONTENT ─────────────────────────────────────────── -->
<main class="main-content">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="market-status-inline">
            <span id="topMarketStatus">
                <!-- populated by JS if needed, or passed from context -->
            </span>
        </div>
        <button id="btnUpdateData" class="btn btn-outline" onclick="postAction('/api/update-data')">
            <i data-lucide="download-cloud"></i>
            Perbarui Data
        </button>
        <button id="btnRunScanner" class="btn btn-amber" onclick="postAction('/api/run-scanner')">
            <i data-lucide="play"></i>
            Jalankan Scan
        </button>
        <span id="globalSpinner" class="spinner hidden"></span>
    </div>

    <!-- Scan Progress Bar -->
    <div id="scanProgressWrap" class="scan-progress-wrap">
        <div class="scan-progress-meta">
            <span id="scanProgressLabel">Mempersiapkan scan...</span>
            <span id="scanProgressCount" class="mono" style="font-size:12px;"></span>
        </div>
        <div class="scan-progress-bar-track">
            <div id="scanProgressFill" class="scan-progress-bar-fill" style="width:0%"></div>
        </div>
    </div>

    {% block content %}{% endblock %}
</main>

<!-- ── GLOBAL SCRIPTS ────────────────────────────────────────── -->
<script>
    // Initialize Lucide icons
    lucide.createIcons();

    // ── Progress & Status Polling ─────────────────────────────
    function setButtonsDisabled(disabled) {
        document.getElementById('btnUpdateData').disabled = disabled;
        document.getElementById('btnRunScanner').disabled = disabled;
    }

    function updateProgressUI(progress) {
        const wrap = document.getElementById('scanProgressWrap');
        const fill = document.getElementById('scanProgressFill');
        const label = document.getElementById('scanProgressLabel');
        const count = document.getElementById('scanProgressCount');
        const { current, total, phase } = progress;

        if (phase === 'idle') {
            wrap.classList.remove('visible');
            fill.style.width = '0%';
            return;
        }

        wrap.classList.add('visible');

        if (total > 0) {
            const pct = Math.round((current / total) * 100);
            fill.style.width = pct + '%';
            count.textContent = `${current} / ${total} saham`;
            label.textContent = phase === 'downloading'
                ? 'Mendownload data pasar...'
                : 'Memindai saham...';
        } else {
            fill.style.width = '15%';
            count.textContent = '';
            label.textContent = phase === 'downloading'
                ? 'Mendownload data...'
                : 'Mempersiapkan scanner...';
        }
    }

    async function postAction(url) {
        try {
            setButtonsDisabled(true);
            document.getElementById('globalSpinner').classList.remove('hidden');
            const res = await fetch(url, { method: 'POST' });
            if (res.ok) { pollStatus(); }
        } catch (e) {
            console.error(e);
            document.getElementById('globalSpinner').classList.add('hidden');
            setButtonsDisabled(false);
        }
    }

    async function pollStatus() {
        try {
            const [statusRes, progressRes] = await Promise.all([
                fetch('/api/status'),
                fetch('/api/scan-progress')
            ]);
            const data = await statusRes.json();
            const progress = await progressRes.json();

            updateProgressUI(progress);

            if (data.status !== 'idle' && data.status !== 'error') {
                document.getElementById('globalSpinner').classList.remove('hidden');
                setTimeout(pollStatus, 1000);
            } else {
                document.getElementById('globalSpinner').classList.add('hidden');
                setButtonsDisabled(false);
                updateProgressUI({ current: 0, total: 0, phase: 'idle' });
                if (data.status === 'idle') {
                    setTimeout(() => window.location.reload(), 800);
                }
            }
        } catch (e) {
            console.error(e);
            document.getElementById('globalSpinner').classList.add('hidden');
            setButtonsDisabled(false);
        }
    }

    // Re-init Lucide after any dynamic DOM update
    window.reinitLucide = function() { lucide.createIcons(); };

    // Vanilla JS modal support for data-bs-toggle and data-bs-dismiss
    document.addEventListener('click', function(e) {
        const toggle = e.target.closest('[data-bs-toggle="modal"]');
        if (toggle) {
            e.preventDefault();
            const targetSelector = toggle.getAttribute('data-bs-target');
            const modal = document.querySelector(targetSelector);
            if (modal) {
                modal.classList.add('show');
                modal.style.display = 'flex';
            }
        }
        const dismiss = e.target.closest('[data-bs-dismiss="modal"]');
        if (dismiss) {
            e.preventDefault();
            const modal = dismiss.closest('.modal, .modal-overlay');
            if (modal) {
                modal.classList.remove('show');
                modal.style.display = 'none';
            }
        }
    });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
